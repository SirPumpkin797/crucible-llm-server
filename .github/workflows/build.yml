name: Build iOS IPA

on:
  push:
    branches: [master, fix/inference-stability-20261031, feature/iphone-ai-voice-server]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find and select Xcode with iOS SDK
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          # Use latest available Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -showsdks | grep -i ios

      - name: Build llama.cpp xcframework
        run: |
          cd llama.cpp
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
          ls -la build-apple/llama.xcframework/

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project llama.swiftui.xcodeproj \
            -scheme llama.swiftui \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Verify voice-enabled app build
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -s "$APP_PATH/$EXECUTABLE"
          echo "Build verification succeeded for $GITHUB_SHA"

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          printf 'branch=%s\ncommit=%s\nrun=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > Payload/BUILD_INFO.txt
          zip -r CrucibleLLM.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrucibleLLM
          path: CrucibleLLM.ipa

      - name: Publish direct IPA download (no ZIP)
        if: github.ref == 'refs/heads/feature/iphone-ai-voice-server'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-server-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: iPhone Voice Server Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: CrucibleLLM.ipa
          fail_on_unmatched_files: true
